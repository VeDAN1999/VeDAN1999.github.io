<div class="cb" id="cb-{{ include.id | default: 'main' }}" data-controls="{{ include.controls | default: 'false' }}">
  <div class="cb-grid">
    <div class="cb-panel"><canvas class="cb-pot"></canvas><div class="cb-label">Effective potential <span class="cb-math">Φ(x)</span></div></div>
    <div class="cb-panel"><canvas class="cb-plane"></canvas><div class="cb-label">Complex <span class="cb-math">x</span>-plane</div></div>
    <div class="cb-panel"><canvas class="cb-time"></canvas><div class="cb-label">The bounce <span class="cb-math">x(t)</span></div></div>
  </div>
  <div class="cb-bar">
    <span class="cb-readout">D = <span class="cb-D">0.100</span></span>
    <input class="cb-slider" type="range" min="0" max="1000" value="500" aria-label="Noise strength D">
    <button class="cb-play" type="button" aria-label="Pause">❚❚</button>
    <span class="cb-hint">weak noise ← <span class="cb-math">D</span> → strong noise</span>
  </div>
</div>

<style>
.cb { margin: 1.5rem 0 2rem; --cb-re: #b5461a; --cb-im: #1f7a8c; --cb-tilt: rgba(181, 70, 26, .13); --cb-glow: rgba(181, 70, 26, .45); }
@media (prefers-color-scheme: dark) { .cb { --cb-re: #f0905f; --cb-im: #5fc4d6; --cb-tilt: rgba(240, 144, 95, .16); --cb-glow: rgba(240, 144, 95, .55); } }
.cb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
.cb-panel { position: relative; background: var(--code-bg); border-radius: 10px; overflow: hidden; }
.cb-panel canvas { display: block; width: 100%; aspect-ratio: 1 / 1; }
.cb-label { position: absolute; left: .7rem; top: .5rem; white-space: nowrap; font-size: .72rem; color: var(--muted); letter-spacing: .02em; pointer-events: none; }
.cb-math { font-family: var(--serif); font-style: italic; font-size: .98rem; }
.cb-bar { display: flex; align-items: center; gap: .9rem; margin-top: .65rem; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.cb-readout { font-family: var(--mono); color: var(--ink); min-width: 6.5rem; }
.cb-slider { flex: 1; min-width: 8rem; accent-color: var(--cb-re); }
.cb-play { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 4px; padding: .15rem .5rem; cursor: pointer; font-size: .75rem; }
.cb-hint { white-space: nowrap; }
.cb[data-controls="false"] .cb-slider, .cb[data-controls="false"] .cb-hint { display: none; }
@media (max-width: 640px) {
  .cb-grid { grid-template-columns: 1fr 1fr; }
  .cb-grid .cb-panel:last-child { grid-column: 1 / -1; }
  .cb-grid .cb-panel:last-child canvas { aspect-ratio: 2 / 1; }
}
</style>

<script>
(function () {
  const root = document.getElementById('cb-{{ include.id | default: 'main' }}');
  if (!root) return;
  const a = 1.0, T = 7.0, dt = 0.01, N = Math.round(T / dt);
  const Dmin = 0.002, Dmax = 0.25;

  // Mechanics: xdot^2 = U(x) - U(xf),  U = (a^2 - x^2)^2 + 4Dx,  Phi = -U
  const U = (x, D) => Math.pow(a*a - x*x, 2) + 4*D*x;
  const Phi = (x, D) => -U(x, D);

  const cmul = (p, q) => [p[0]*q[0] - p[1]*q[1], p[0]*q[1] + p[1]*q[0]];
  const cadd = (p, q) => [p[0]+q[0], p[1]+q[1]];
  const csc = (p, s) => [p[0]*s, p[1]*s];
  function F(x, D) {                       // x'' = U'(x)/2 = -2x(a^2 - x^2) + 2D
    const x2 = cmul(x, x), b = [a*a - x2[0], -x2[1]], r = csc(cmul(x, b), -2);
    return [r[0] + 2*D, r[1]];
  }
  function fixedPoint(D) {                 // saddle near -a: x^3 - a^2 x + D = 0
    let x = -a;
    for (let i = 0; i < 30; i++) { const f = x*x*x - a*a*x + D, df = 3*x*x - a*a; x -= f/df; }
    return x;
  }
  function turningPoint(D, Uf) {           // complex root of U(x) = U(xf) near +a, Im > 0
    let x = [a, Math.sqrt(2*D) + 0.05];
    for (let i = 0; i < 60; i++) {
      const x2 = cmul(x, x), b = [a*a - x2[0], -x2[1]];
      const g = cadd(cmul(b, b), [4*D*x[0] - Uf, 4*D*x[1]]);
      const dg = cadd(csc(cmul(x, b), -4), [4*D, 0]);
      const den = dg[0]*dg[0] + dg[1]*dg[1];
      x = [x[0] - (g[0]*dg[0] + g[1]*dg[1])/den, x[1] - (g[1]*dg[0] - g[0]*dg[1])/den];
    }
    if (x[1] < 0) x[1] = -x[1];
    return x;
  }
  function trajectory(D) {
    const xf = fixedPoint(D), xt = turningPoint(D, U(xf, D));
    const pts = new Array(N + 1); let x = xt.slice(), v = [0, 0]; pts[0] = x.slice();
    for (let i = 1; i <= N; i++) {
      const k1x = v, k1v = F(x, D);
      const x2 = cadd(x, csc(k1x, dt/2)), v2 = cadd(v, csc(k1v, dt/2)), k2x = v2, k2v = F(x2, D);
      const x3 = cadd(x, csc(k2x, dt/2)), v3 = cadd(v, csc(k2v, dt/2)), k3x = v3, k3v = F(x3, D);
      const x4 = cadd(x, csc(k3x, dt)),   v4 = cadd(v, csc(k3v, dt)),   k4x = v4, k4v = F(x4, D);
      x = cadd(x, csc(cadd(cadd(k1x, csc(k2x, 2)), cadd(csc(k3x, 2), k4x)), dt/6));
      v = cadd(v, csc(cadd(cadd(k1v, csc(k2v, 2)), cadd(csc(k3v, 2), k4v)), dt/6));
      pts[i] = x.slice();
    }
    return { D, xf, xt, pts };             // pts[i] = x(i dt), t >= 0; x(-t) = x(t)
  }
  const atTime = (tr, t) => tr.pts[Math.min(N, Math.round(Math.abs(t) / dt))];

  // ---- drawing helpers
  const cPot = root.querySelector('.cb-pot'), cPlane = root.querySelector('.cb-plane'), cTime = root.querySelector('.cb-time');
  const slider = root.querySelector('.cb-slider'), readout = root.querySelector('.cb-D'), playBtn = root.querySelector('.cb-play');
  let col = {};
  function refreshColors() {
    const s = getComputedStyle(root), v = n => s.getPropertyValue(n).trim();
    col = { ink: v('--ink'), muted: v('--muted'), rule: v('--rule'), re: v('--cb-re'), im: v('--cb-im'), tilt: v('--cb-tilt'), glow: v('--cb-glow') };
  }
  function fit(c) {
    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
    return [g, r.width, r.height];
  }
  const mapper = (w, h, x0, x1, y0, y1, pad) => ({ X: x => pad + (x - x0)/(x1 - x0)*(w - 2*pad), Y: y => h - pad - (y - y0)/(y1 - y0)*(h - 2*pad) });
  function label(g, text, x, y, color, align, italic, size) {
    g.fillStyle = color; g.font = (italic ? 'italic ' : '') + (size || 12) + 'px Newsreader, Georgia, serif'; g.textAlign = align || 'left'; g.fillText(text, x, y);
  }
  // colour interpolation re -> im by |Im x| / a
  function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function mix(c1, c2, f) { const A = hexToRgb(c1), B = hexToRgb(c2); return `rgb(${A.map((v, i) => Math.round(v + (B[i]-v)*f)).join(',')})`; }
  const pathColor = im => mix(col.re, col.im, Math.min(1, Math.abs(im)/a));
  function strokeGradientPath(g, pts, px, py, width, alpha, mirror) {
    g.lineCap = 'round'; g.lineWidth = width; g.globalAlpha = alpha;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i-1], q = pts[i], s = mirror ? -1 : 1;
      g.strokeStyle = pathColor(q[1]); g.beginPath(); g.moveTo(px(p[0]), py(s*p[1])); g.lineTo(px(q[0]), py(s*q[1])); g.stroke();
    }
    g.globalAlpha = 1;
  }
  function glowDot(g, x, y, r, color) {
    g.save(); g.shadowColor = col.glow; g.shadowBlur = 14; g.fillStyle = color; g.beginPath(); g.arc(x, y, r, 0, 2*Math.PI); g.fill(); g.restore();
    g.fillStyle = color; g.beginPath(); g.arc(x, y, r, 0, 2*Math.PI); g.fill();
  }

  function drawPotential(tr, t) {
    const [g, w, h] = fit(cPot);
    const D = tr.D, Ef = Phi(tr.xf, D), x0 = -1.55, x1 = 1.55;
    const m = mapper(w, h, x0, x1, -2.6, 1.7, 24);
    // tilt: shade between Phi_D and Phi_0
    g.fillStyle = col.tilt; g.beginPath();
    for (let i = 0; i <= 200; i++) { const x = x0 + (x1-x0)*i/200; i ? g.lineTo(m.X(x), m.Y(Phi(x, D))) : g.moveTo(m.X(x), m.Y(Phi(x, D))); }
    for (let i = 200; i >= 0; i--) { const x = x0 + (x1-x0)*i/200; g.lineTo(m.X(x), m.Y(Phi(x, 0))); }
    g.closePath(); g.fill();
    // D = 0 reference
    g.setLineDash([3, 4]); g.strokeStyle = col.muted; g.globalAlpha = .5; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i <= 200; i++) { const x = x0 + (x1-x0)*i/200; i ? g.lineTo(m.X(x), m.Y(Phi(x, 0))) : g.moveTo(m.X(x), m.Y(Phi(x, 0))); }
    g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    // saddle energy
    g.strokeStyle = col.muted; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(m.X(x0), m.Y(Ef)); g.lineTo(m.X(x1), m.Y(Ef)); g.stroke(); g.setLineDash([]);
    label(g, 'E', m.X(x1) - 2, m.Y(Ef) - 5, col.muted, 'right', true);
    // Phi_D
    g.strokeStyle = col.ink; g.lineWidth = 1.9; g.lineJoin = 'round'; g.beginPath();
    for (let i = 0; i <= 300; i++) { const x = x0 + (x1-x0)*i/300; i ? g.lineTo(m.X(x), m.Y(Phi(x, D))) : g.moveTo(m.X(x), m.Y(Phi(x, D))); }
    g.stroke();
    // labels along the bottom
    label(g, 'well', m.X(-a), h - 8, col.muted, 'center');
    label(g, 'barrier', m.X(a), h - 8, col.muted, 'center');
    label(g, 'Itô tilt  −4Dx', m.X(0.05), m.Y(Phi(0.05, D)) + 20, col.re, 'left', true);
    // particle at Re x; fades and lifts off as it leaves the real axis
    const x = atTime(tr, t), im = Math.abs(x[1]);
    const y = Phi(x[0], D), px = m.X(x[0]), py = m.Y(y);
    if (im > 0.03) {
      g.strokeStyle = pathColor(im); g.lineWidth = 1; g.setLineDash([2, 3]); g.globalAlpha = .8; g.beginPath(); g.moveTo(px, py); g.lineTo(px, py - 60*im); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
      g.strokeStyle = pathColor(im); g.lineWidth = 1.5; g.beginPath(); g.arc(px, py - 60*im, 4.5, 0, 2*Math.PI); g.stroke();
      label(g, 'complex', px + 8, py - 60*im + 4, col.im, 'left', true, 11);
    }
    glowDot(g, px, py, 5.5, pathColor(im));
  }

  function drawPlane(tr, t) {
    const [g, w, h] = fit(cPlane);
    const m = mapper(w, h, -1.45, 1.45, -1.35, 1.35, 24);
    g.strokeStyle = col.rule; g.lineWidth = 1; g.beginPath();
    g.moveTo(m.X(-1.45), m.Y(0)); g.lineTo(m.X(1.45), m.Y(0)); g.moveTo(m.X(0), m.Y(-1.35)); g.lineTo(m.X(0), m.Y(1.35)); g.stroke();
    label(g, 'Re x', w - 10, m.Y(0) - 6, col.muted, 'right', true);
    label(g, 'Im x', m.X(0) + 6, m.Y(1.2), col.muted, 'left', true);
    // real bounce (D = 0): the segment [-a, a]
    g.strokeStyle = col.muted; g.lineWidth = 4; g.globalAlpha = .28; g.lineCap = 'round'; g.beginPath(); g.moveTo(m.X(-a), m.Y(0)); g.lineTo(m.X(a), m.Y(0)); g.stroke(); g.globalAlpha = 1;
    label(g, 'real bounce', m.X(0), m.Y(0) + 16, col.muted, 'center', true, 11);
    // conjugate branch (faint) and the complex bounce
    strokeGradientPath(g, tr.pts, m.X, m.Y, 1.2, .25, true);
    strokeGradientPath(g, tr.pts, m.X, m.Y, 2.4, 1, false);
    // saddle and turning points
    g.fillStyle = col.ink; g.beginPath(); g.arc(m.X(tr.xf), m.Y(0), 3.5, 0, 2*Math.PI); g.fill();
    label(g, 'x', m.X(tr.xf) - 6, m.Y(0) - 10, col.ink, 'right', true); label(g, 'f', m.X(tr.xf) - 1, m.Y(0) - 7, col.ink, 'right', true, 9);
    g.strokeStyle = col.ink; g.lineWidth = 1.3;
    g.beginPath(); g.arc(m.X(tr.xt[0]), m.Y(tr.xt[1]), 4, 0, 2*Math.PI); g.stroke();
    g.beginPath(); g.arc(m.X(tr.xt[0]), m.Y(-tr.xt[1]), 4, 0, 2*Math.PI); g.stroke();
    label(g, 'turning points', m.X(tr.xt[0]) + 2, m.Y(-tr.xt[1]) + 18, col.muted, 'center', true, 11);
    const x = atTime(tr, t);
    glowDot(g, m.X(x[0]), m.Y(x[1]), 6, pathColor(x[1]));
  }

  function drawTime(tr, t) {
    const [g, w, h] = fit(cTime);
    const m = mapper(w, h, -T, T, -1.35, 1.35, 24);
    g.strokeStyle = col.rule; g.lineWidth = 1; g.beginPath(); g.moveTo(m.X(-T), m.Y(0)); g.lineTo(m.X(T), m.Y(0)); g.stroke();
    g.setLineDash([3, 4]); g.globalAlpha = .7; g.beginPath(); g.moveTo(m.X(-T), m.Y(a)); g.lineTo(m.X(T), m.Y(a)); g.moveTo(m.X(-T), m.Y(-a)); g.lineTo(m.X(T), m.Y(-a)); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    label(g, '+a', m.X(-T) + 2, m.Y(a) - 4, col.muted, 'left', true, 11);
    label(g, '−a', m.X(-T) + 2, m.Y(-a) - 4, col.muted, 'left', true, 11);
    label(g, 't', w - 10, m.Y(0) + 14, col.muted, 'right', true);
    const series = (idx, color, width) => {
      g.strokeStyle = color; g.lineWidth = width; g.lineJoin = 'round'; g.beginPath();
      for (let i = -N; i <= N; i++) { const p = tr.pts[Math.abs(i)]; i === -N ? g.moveTo(m.X(i*dt), m.Y(p[idx])) : g.lineTo(m.X(i*dt), m.Y(p[idx])); }
      g.stroke();
    };
    series(1, col.im, 1.6); series(0, col.re, 2.2);
    // legend, top right
    g.fillStyle = col.re; g.fillRect(w - 96, 32, 14, 2.5); label(g, 'Re x', w - 76, 36, col.re, 'left', true, 11);
    g.fillStyle = col.im; g.fillRect(w - 50, 32, 14, 2.5); label(g, 'Im x', w - 30, 36, col.im, 'left', true, 11);
    label(g, 'instanton', m.X(-T*0.55), m.Y(-0.25), col.muted, 'center', true, 11);
    label(g, 'anti-instanton', m.X(T*0.55), m.Y(-0.25), col.muted, 'center', true, 11);
    const x = atTime(tr, t);
    g.fillStyle = col.im; g.beginPath(); g.arc(m.X(t), m.Y(x[1]), 3.5, 0, 2*Math.PI); g.fill();
    glowDot(g, m.X(t), m.Y(x[0]), 5, col.re);
  }

  // ---- state & loop
  const logD = s => Dmin * Math.pow(Dmax / Dmin, s);
  let s = 0.5, tr = trajectory(logD(s)), playing = true, manual = false, t = -T, last = null, phase = 0;
  const tSpeed = 2.0, sweepPeriod = 30;
  function setD(ns, fromSlider) {
    s = Math.min(1, Math.max(0, ns)); tr = trajectory(logD(s)); readout.textContent = logD(s).toFixed(3);
    if (!fromSlider) slider.value = Math.round(s*1000);
  }
  slider.addEventListener('input', () => { manual = true; setD(slider.value/1000, true); });
  playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); });
  let visible = true;
  if ('IntersectionObserver' in window) new IntersectionObserver(e => { visible = e[0].isIntersecting; }, { threshold: .05 }).observe(root);
  const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', refreshColors);
  refreshColors(); setD(s);
  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) { last = now; return; }
    if (last === null) last = now;
    const dr = Math.min(.05, (now - last)/1000); last = now;
    if (playing) {
      t += tSpeed*dr; if (t > T) t = -T;
      if (!manual) { phase = (phase + dr/sweepPeriod) % 1; const tri = 1 - Math.abs(2*phase - 1); setD(0.04 + 0.96*(1 - tri)); }
    }
    drawPotential(tr, t); drawPlane(tr, t); drawTime(tr, t);
  }
  requestAnimationFrame(frame);
})();
</script>
