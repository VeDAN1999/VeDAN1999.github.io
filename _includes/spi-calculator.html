<div class="spi" id="spi">
  <div class="spi-body">
    <div class="spi-top">
      <span class="spi-brand">SPI&#8209;1</span>
      <span class="spi-sub">stochastic path integral calculator</span>
      <span class="spi-solar" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="spi-screen">
      <div class="spi-status"><span class="spi-st-l"></span><span class="spi-st-r"></span></div>
      <canvas class="spi-canvas" aria-label="Calculator display"></canvas>
      <div class="spi-msg" role="status"></div>
    </div>

    <div class="spi-entry">
      <label for="spi-v">V(x) =</label>
      <input id="spi-v" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" value="x^4/4 - x^2/2 + 120/343*x">
      <button type="button" class="spi-key spi-enter" data-act="enter">=</button>
    </div>

    <div class="spi-row spi-modes" role="tablist" aria-label="Display">
      <button type="button" class="spi-key" data-mode="land">LANDSCAPE</button>
      <button type="button" class="spi-key" data-mode="bounce">BOUNCE</button>
      <button type="button" class="spi-key" data-mode="rate">RATE</button>
    </div>

    <div class="spi-dial">
      <span class="spi-dl">NOISE</span>
      <button type="button" class="spi-key spi-small" data-act="dminus" aria-label="Less noise">&divide;2</button>
      <input class="spi-slider" type="range" min="-4" max="-0.5" step="0.01" value="-2" aria-label="Noise strength D over barrier height, log scale">
      <button type="button" class="spi-key spi-small" data-act="dplus" aria-label="More noise">&times;2</button>
      <span class="spi-dread"></span>
    </div>

    <div class="spi-row spi-wells" aria-label="Choose the well and the barrier"></div>

    <div class="spi-row spi-presets" aria-label="Preset potentials">
      <button type="button" class="spi-key spi-preset" data-preset="cubic">CUBIC</button>
      <button type="button" class="spi-key spi-preset" data-preset="quartic">QUARTIC</button>
      <button type="button" class="spi-key spi-preset" data-preset="sg">SINE&#8209;G</button>
      <button type="button" class="spi-key spi-preset" data-preset="wiggly">WIGGLY</button>
      <button type="button" class="spi-key spi-preset" data-preset="sextic">SEXTIC</button>
      <button type="button" class="spi-key spi-preset" data-preset="steep">STEEP</button>
    </div>
    <div class="spi-row spi-toggles">
      <label><input type="checkbox" data-curve="gauss"> Gaussian</label>
      <label><input type="checkbox" data-curve="flat"> flat measure</label>
      <label><input type="checkbox" data-curve="c1" checked> Kramers + first correction</label>
    </div>
  </div>

  <div class="spi-tape" aria-live="polite"><div class="spi-tape-in"></div></div>
</div>

<style>

  --spi-case: #24221c; --spi-case-edge: #3a372e; --spi-key: #312e26; --spi-key-ink: #ece8df; --spi-key-on: #e0885b; --spi-paper: #f4f0e4; --spi-paper-ink: #2a2721; }

  --z: 7px; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--z)) 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--z)) 100%; }
